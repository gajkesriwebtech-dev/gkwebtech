server {
    listen 3000;
    server_name www.gkwebtech.cloud;

    # 301 Redirect www to non-www
    return 301 https://gkwebtech.cloud$request_uri;
}

server {
    listen 3000;
    server_name gkwebtech.cloud localhost "";

    # 301 Redirect HTTP to HTTPS using Traefik's forwarded protocol header
    if ($http_x_forwarded_proto = "http") {
        return 301 https://gkwebtech.cloud$request_uri;
    }

    root /usr/share/nginx/html;
    index index.html;

    # Aggressive caching for static assets
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location /images/ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # SPA routing fallback
    location / {
        try_files $uri $uri/ /index.html;
    }
}
